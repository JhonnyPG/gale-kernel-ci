name: Build Mayuri Kernel (gale)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Rama del kernel a compilar (stable / cip / dev/cip / ...)
        required: false
        default: cip
        type: string
  push:
    branches: [main, master]
    paths: ["patches/**", ".github/workflows/**"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout CI repo (patches + scripts)
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: Mayuri-Chan/android_kernel_xiaomi_gale
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'cip' }}
          path: kernel

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm binutils-aarch64-linux-gnu \
            make python3 bison flex libssl-dev \
            libncurses-dev zstd cpio unzip

      - name: Apply custom patches (if any)
        run: |
          cd kernel
          shopt -s nullglob
          for p in ../ci/patches/*.patch; do
            echo "::group::Applying ${p}"
            git apply --verbose "$p" || echo "ignored: $p"
            echo "::endgroup::"
          done

      - name: Configure
        env:
          ARCH: arm64
          CC: clang
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          cd kernel
          # CONFIG_IKHEADERS builds kernel/kheaders_data.tar.xz via a host
          # "tiny cpio" that is not needed for a flashable boot.img, drop it.
          sed -i '/^CONFIG_IKHEADERS=y/d' arch/arm64/configs/gale_defconfig
          # EXPERIMENT (noLTO) FAILED: non-LTO build of this MTK 4.19 tree
          # oopses at boot in cpuhvfs_pvt_tbl_create (write to read-only PVT
          # table), so ThinLTO must be kept. New hypothesis: the ~15min
          # gaming+charging hang (WDT reset) is NOT LTO codegen. Add
          # softlockup + hung-task detectors with panic instead: if the hang
          # recurs, a panic leaves a backtrace in ramoops for diagnosis.
          printf '\nCONFIG_SOFTLOCKUP_DETECTOR=y\nCONFIG_BOOTPARAM_SOFTLOCKUP_PANIC=y\nCONFIG_DETECT_HUNG_TASK=y\nCONFIG_BOOTPARAM_HUNG_TASK_PANIC=y\nCONFIG_PANIC_TIMEOUT=10\n' >> arch/arm64/configs/gale_defconfig
          # Build OUT-OF-TREE (O=out): in-tree builds (KBUILD_SRC empty) do NOT
          # add -I$(srctree)/$(src) to c_flags (scripts/Makefile.lib), so MTK
          # sources that use `#include <local-header.h>` in the same dir fail
          # with "file not found". O=out sets KBUILD_SRC and enables that -I.
          make O=out ARCH=$ARCH CC=$CC CROSS_COMPILE=aarch64-linux-gnu- \
               LLVM=$LLVM LLVM_IAS=$LLVM_IAS gale_defconfig

      - name: Build kernel + dtbs
        env:
          ARCH: arm64
          CC: clang
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          cd kernel
          make O=out -j$(nproc) ARCH=$ARCH CC=$CC CROSS_COMPILE=aarch64-linux-gnu- \
               LLVM=$LLVM LLVM_IAS=$LLVM_IAS

      - name: Gather artifacts
        run: |
          mkdir -p artifact
          cp -av ${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image.gz artifact/ 2>/dev/null || true
          cp -av ${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/Image   artifact/ 2>/dev/null || true
          cp -av ${GITHUB_WORKSPACE}/kernel/out/arch/arm64/boot/dts/mediatek/*.dtb artifact/ 2>/dev/null || true
          cp -av ${GITHUB_WORKSPACE}/ci/scripts/package-boot-local.sh artifact/ 2>/dev/null || true
          echo "--- produced files ---"
          ls -lah ${GITHUB_WORKSPACE}/artifact

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gale-kernel
          path: artifact/
          retention-days: 30